# ═══════════════════════════════════════════════════════════════════════════════
# PRODUCTION — Nginx configuration
# Server: mydomain.com (frontend) + api.mydomain.com (PocketBase)
# ─────────────────────────────────────────────────────────────────────────────
# Install to: /etc/nginx/sites-available/production
# Enable with: ln -s /etc/nginx/sites-available/production /etc/nginx/sites-enabled/
# SSL via: certbot --nginx -d mydomain.com -d www.mydomain.com -d api.mydomain.com
# ═══════════════════════════════════════════════════════════════════════════════

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mydomain.com www.mydomain.com api.mydomain.com;
    return 301 https://$host$request_uri;
}

# ── Frontend — mydomain.com ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mydomain.com www.mydomain.com;

    root /var/www/igk-prod;
    index index.html;

    # SSL — managed by Certbot (do not edit these lines manually)
    ssl_certificate     /etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache (React Router needs the latest shell)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SPA fallback — all unknown paths serve index.html (React Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}

# ── PocketBase API — api.mydomain.com ────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mydomain.com;

    ssl_certificate     /etc/letsencrypt/live/mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # PocketBase runs on 127.0.0.1:8090 (production systemd service)
    location / {
        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # WebSocket support (PocketBase realtime subscriptions)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (generous for large file uploads)
        proxy_read_timeout    600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;

        # Upload size (adjust to your max file upload size)
        client_max_body_size 50m;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
}
