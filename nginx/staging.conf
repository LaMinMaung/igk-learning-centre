# ═══════════════════════════════════════════════════════════════════════════════
# STAGING — Nginx configuration
# Server: tst.mydomain.com (frontend) + api.tst.mydomain.com (PocketBase)
# ─────────────────────────────────────────────────────────────────────────────
# Install to: /etc/nginx/sites-available/staging
# Enable with: ln -s /etc/nginx/sites-available/staging /etc/nginx/sites-enabled/
# SSL via: certbot --nginx -d tst.mydomain.com -d api.tst.mydomain.com
# ═══════════════════════════════════════════════════════════════════════════════

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tst.mydomain.com api.tst.mydomain.com;
    return 301 https://$host$request_uri;
}

# ── Frontend — tst.mydomain.com ───────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tst.mydomain.com;

    root /var/www/igk-staging;
    index index.html;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/tst.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tst.mydomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;
    add_header X-Content-Type-Options    "nosniff"          always;

    # Staging: add a noindex header so search engines ignore this environment
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Cache static assets (hashed filenames from Vite)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — never cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        # Staging: prevent indexing at page level too
        add_header X-Robots-Tag "noindex, nofollow";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}

# ── PocketBase API — api.tst.mydomain.com ────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tst.mydomain.com;

    ssl_certificate     /etc/letsencrypt/live/tst.mydomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tst.mydomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Staging PocketBase runs on port 8091 (separate from production)
    location / {
        proxy_pass         http://127.0.0.1:8091;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        client_max_body_size  50m;
    }

    location ~ /\. {
        deny all;
    }
}
